name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          echo "Creating .env file from GitHub Secrets..."
          cat > .env << EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          APP_PORT=${{ secrets.APP_PORT }}
          APP_SECRET=${{ secrets.APP_SECRET }}
          API_KEY=${{ secrets.API_KEY }}
          COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}
          EOF
          echo "Contents (masked):"
          cat .env | sed 's/=.*/=***/'

      - name: Deploy with Docker Compose
        run: |
          echo "Starting application stack..."
          docker compose up -d 
          echo "Waiting for services to start..."
          sleep 20

      - name: Verify containers are running
        run: |
          docker compose ps
          if docker compose ps | grep -q "Up"; then
            echo "✓ All containers are running"
          else
            echo "✗ Some containers failed to start"
            docker compose logs
            exit 1
          fi

      - name: Run application tests
        run: |
          echo "=== DIAGNOSTICS START ==="
          echo "1. Checking running containers and ports:"
          docker compose ps
          
          echo "2. Checking application logs (app/backend):"
          docker compose logs 
          
          echo "=== DIAGNOSTICS END ==="
          
          echo "Waiting for app to be fully ready..."
          sleep 10

          echo "Testing connection on port ${{ secrets.APP_PORT }}..."
          if curl -v http://localhost:${{ secrets.APP_PORT }}/health; then
            echo "✓ Web application is healthy"
          else
            echo "✗ Web application health check failed"
            exit 1
          fi

          # ТЕСТ 2: Сравнение данных (если первый тест прошел)
          echo "2. Testing data consistency..."
          DB_COUNT=$(docker compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM items;" | tr -d ' \n\r' || echo "0")
          WEB_COUNT=$(curl -s http://localhost:${{ secrets.APP_PORT }}/api/items/count | tr -d ' \n\r')
          
          echo "Database count: $DB_COUNT"
          echo "Web API count: $WEB_COUNT"
          
          if [ "$DB_COUNT" = "$WEB_COUNT" ]; then
            echo "✓ Data consistency test passed"
          else
            echo "✗ Data consistency test failed"
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs-and-env
          path: .env
          retention-days: 7
